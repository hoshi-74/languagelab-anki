<div class="ll-card theme-__THEME__">
  <div class="ll-header">__HEADER__</div>
  <main class="ll-main">
    <div class="ll-prompt ll-typing-prompt">{{Prompt}}</div>
    <div class="ll-input">{{type:Answer}}</div>
    {{#TTS}}<div class="ll-audio ll-answer-audio">{{tts __TTS_LANG__:TTS}}</div>{{/TTS}}
    {{#Context}}<div class="ll-context">{{Context}}</div>{{/Context}}
    {{#Explanation}}<details open><summary>说明</summary><div class="ll-details">{{Explanation}}</div></details>{{/Explanation}}
    {{#Sources}}<details><summary>来源</summary><div class="ll-details ll-sources">{{Sources}}</div></details>{{/Sources}}
  </main>
</div>
