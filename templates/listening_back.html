<div class="ll-card theme-__THEME__">
  <div class="ll-header">__HEADER__</div>
  <main class="ll-main ll-listening">
    <div class="ll-back-label">原文与含义</div>
    <div class="ll-audio ll-answer-audio">{{tts __TTS_LANG__:Target}}</div>
    {{#Dictation}}<div class="ll-input">{{type:Target}}</div>{{/Dictation}}
    <div class="ll-target">{{Target}}</div>
    <div class="ll-answer">{{Meaning}}</div>
    {{#Context}}<div class="ll-context">{{Context}}</div>{{/Context}}
    {{#Extra}}<details open><summary>辨听复盘</summary><div class="ll-details">{{Extra}}</div></details>{{/Extra}}
    {{#Sources}}<details><summary>来源</summary><div class="ll-details ll-sources">{{Sources}}</div></details>{{/Sources}}
  </main>
</div>
