<div class="ll-card theme-__THEME__">
  <div class="ll-header">__HEADER__</div>
  <main class="ll-main">
    <div class="ll-back-label">结构化答案</div>
    <div class="ll-target">{{Target}}</div>
    {{#Reading}}<div class="ll-reading">{{Reading}}</div>{{/Reading}}
    {{#TTS}}<div class="ll-audio">{{tts __TTS_LANG__:TTS}}</div>{{/TTS}}
    <hr id="answer">
    <div class="ll-answer">{{Answer}}</div>
    {{#Extra}}<details><summary>扩展信息</summary><div class="ll-details">{{Extra}}</div></details>{{/Extra}}
    {{#Sources}}<details><summary>来源</summary><div class="ll-details ll-sources">{{Sources}}</div></details>{{/Sources}}
  </main>
</div>
