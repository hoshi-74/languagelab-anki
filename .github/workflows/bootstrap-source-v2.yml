name: Bootstrap source tree

on:
  push:
    paths:
      - .github/workflows/bootstrap-source-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack audited source archive
        run: |
          unzip -o languagelab-source.zip
          rm languagelab-source.zip
      - name: Commit non-workflow source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- . ':(exclude).github/**'
          git commit -m "Add LanguageLab source tree"
          git push
